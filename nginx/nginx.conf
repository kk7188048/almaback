worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;
    include       /etc/nginx/mime.types;
    default_type  application/json;
    sendfile on;
    keepalive_timeout 30s;
    gzip on;
    gzip_types application/json text/plain;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    # Coarse edge limits; the app also applies per-user token buckets from Redis.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status 429;

    resolver 127.0.0.11 valid=5s ipv6=off;   # Docker DNS: follow the api container when it is replaced

    log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","req":"$request","status":$status,"bytes":$body_bytes_sent,"ms":"$request_time","rid":"$request_id"}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    server {
        listen 80;
        # TLS: put fullchain.pem / privkey.pem in ./nginx/certs, uncomment the 443 block and the redirect below.
        # (Or terminate TLS at an ALB / CloudFront and leave this server on 80.)
        # return 301 https://$host$request_uri;

        set $api http://api:8000;
        client_max_body_size 1m;   # the API only receives small JSON bodies; large files go straight to S3
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # enable with TLS

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append: clients cannot spoof their IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        location = /healthz { proxy_pass $api; access_log off; }

        # Internal-only endpoints are not exposed publicly
        location = /readyz { allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; deny all; proxy_pass $api; }
        location /api/v1/admin/ { allow 127.0.0.1; allow 10.0.0.0/8; allow 172.16.0.0/12; deny all; limit_req zone=api burst=10 nodelay; proxy_pass $api; }

        location /api/v1/auth/ { limit_req zone=login burst=5 nodelay; proxy_pass $api; }

        # Server-sent events: no buffering, long read timeout
        location ~ ^/api/v1/jobs/[^/]+/events$ {
            limit_conn conn 10;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_pass $api;
        }

        # Local-disk storage backend only (dev / single host): streamed uploads up to the app's own cap
        location = /api/v1/_local/upload {
            client_max_body_size 2g;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_pass $api;
        }

        location / { limit_req zone=api burst=40 nodelay; proxy_pass $api; }
    }

    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ... same locations as above ...
    # }
}
